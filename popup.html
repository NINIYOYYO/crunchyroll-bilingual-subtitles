<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; padding: 15px; font-family: sans-serif; background: #141519; color: white; }
    h3 { color: #f47521; margin: 0 0 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .item { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    select, input { width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
    .ai-config { background: #1c1d22; padding: 10px; border-radius: 4px; margin-top: 10px; border: 1px dashed #444; }
    .row { display: flex; gap: 10px; }
    .row .item { flex: 1; }
    button { width: 100%; padding: 10px; background: #f47521; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
    button:hover { background: #ff8c3a; }
    button:disabled { background: #666; cursor: not-allowed; }
    .status { display: none; margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 12px; text-align: center; }
    .status.success { background: #1a3a1a; color: #55FF55; border: 1px solid #55FF55; }
    .status.error { background: #3a1a1a; color: #FF6B6B; border: 1px solid #FF6B6B; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-label { margin: 0; font-size: 13px; }
    .toggle-label.hl { color: #f47521; }
    .toggle-group { border: 1px dashed #555; border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
    .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #555; transition: .2s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; transition: .2s; border-radius: 50%; }
    .switch input:checked + .slider { background: #f47521; }
    .switch input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>
<body>
  <h3 id="title"></h3>
  <div id="save-status" class="status"></div>

  <div class="row">
    <div class="item">
        <label id="label-lang"></label>
        <select id="lang-select">
            <option value="zh-CN">zh-CN</option>
            <option value="zh-HK">zh-HK</option>
            <option value="en-US">en-US</option>
            <option value="ja-JP">ja-JP</option>
            <option value="ko-KR">ko-KR</option>
            <option value="es-419">es-419</option>
            <option value="es-ES">es-ES</option>
            <option value="pt-BR">pt-BR</option>
            <option value="fr-FR">fr-FR</option>
            <option value="de-DE">de-DE</option>
            <option value="it-IT">it-IT</option>
            <option value="ru-RU">ru-RU</option>
            <option value="tr-TR">tr-TR</option>
            <option value="hi-IN">hi-IN</option>
            <option value="pl-PL">pl-PL</option>
            <option value="nl-NL">nl-NL</option>
            <option value="sv-SE">sv-SE</option>
            <option value="fi-FI">fi-FI</option>
            <option value="no-NO">no-NO</option>
            <option value="da-DK">da-DK</option>
            <option value="cs-CZ">cs-CZ</option>
            <option value="hu-HU">hu-HU</option>
            <option value="ro-RO">ro-RO</option>
            <option value="uk-UA">uk-UA</option>
            <option value="el-GR">el-GR</option>
            <option value="he-IL">he-IL</option>
            <option value="tl-PH">tl-PH</option>
            <option value="ar-SA">ar-SA</option>
            <option value="vi-VN">vi-VN</option>
            <option value="th-TH">th-TH</option>
            <option value="id-ID">id-ID</option>
            <option value="ms-MY">ms-MY</option>
        </select>
    </div>
    <div class="item">
        <label id="label-mode"></label>
        <select id="mode-select">
            <option value="fallback"></option>
            <option value="force_ai"></option>
            <option value="native"></option>
        </select>
    </div>
  </div>

  <div class="item">
    <label id="label-engine"></label>
    <select id="engine-select">
      <option value="google"></option>
      <option value="custom_llm"></option>
    </select>
  </div>

  <div id="ai-fields" class="ai-config" style="display:none;">
    <div class="item">
      <label id="label-api-url"></label>
      <input type="text" id="api-url" placeholder="">
    </div>
    <div class="row">
        <div class="item">
            <label id="label-model"></label>
            <input type="text" id="ai-model" placeholder="">
        </div>
        <div class="item">
            <label id="label-api-key"></label>
            <input type="password" id="api-key" placeholder="">
        </div>
    </div>

    <div class="toggle-group">
        <div class="item toggle-row">
            <label for="reasoning-toggle" id="label-effort" class="toggle-label hl"></label>
            <label class="switch">
                <input type="checkbox" id="reasoning-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="item toggle-row">
            <label for="streaming-toggle" id="label-streaming" class="toggle-label"></label>
            <label class="switch">
                <input type="checkbox" id="streaming-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="item toggle-row">
            <label for="autorepair-toggle" id="label-autorepair" class="toggle-label"></label>
            <label class="switch">
                <input type="checkbox" id="autorepair-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="row" style="margin-top: 5px;">
        <div class="item">
            <label id="label-batch"></label>
            <input type="number" id="batch-size" min="1" max="50" value="10">
        </div>
        <div class="item">
            <label id="label-concurrency"></label>
            <input type="number" id="concurrency" min="1" max="10" value="3">
        </div>
    </div>
  </div>

  <button id="save-btn"></button>
  <script src="popup.js"></script>
</body>
</html>
